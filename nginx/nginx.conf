# ==========================================
# CloudPulse Nginx Reverse Proxy & Load Balancer
# Demonstrates horizontal scaling & round-robin routing
# ==========================================

events {
    worker_connections 1024;
}

http {
    upstream cloudpulse_cluster {
        # Round-robin distribution across microservice replicas
        server web-node-1:8000;
        server web-node-2:8000;
        server web-node-3:8000;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://cloudpulse_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Ensure custom distributed tracing headers pass through
            proxy_pass_header X-Instance-ID;
            proxy_pass_header X-Response-Time-Ms;
        }

        # Direct health check probe on load balancer
        location /lb-health {
            access_log off;
            return 200 "Load Balancer Active\n";
        }
    }
}
