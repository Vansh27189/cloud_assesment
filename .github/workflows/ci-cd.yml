name: CI/CD Pipeline - CloudPulse Microservice

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ============================================================
  # Job 1: Test & Quality Gate (BLOCKS PIPELINE IF TESTS FAIL)
  # ============================================================
  test:
    name: Run Unit & Integration Tests (Quality Gate)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Syntax & Lint Verification (flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Execute Automated Test Suite (Pytest)
        run: |
          pytest -v tests/ --junitxml=test-results.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml

  # ============================================================
  # Job 2: Container Build & Health Check (Runs after tests pass)
  # ============================================================
  build-and-deploy:
    name: Build Docker Container & Cloud Verification
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    env:
      HAS_AWS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image Locally
        run: |
          docker build -t cloudpulse-microservice:latest .

      - name: Test Docker Container In CI
        run: |
          docker run -d --name test-app -p 8000:8000 cloudpulse-microservice:latest
          sleep 4
          curl --fail --retry 4 --retry-delay 2 http://localhost:8000/health || (docker logs test-app && exit 1)
          docker stop test-app

      # Optional AWS ECR Push (activated only when repository secrets are set)
      - name: Configure AWS Credentials
        if: env.HAS_AWS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        if: env.HAS_AWS == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker Image to Amazon ECR
        if: env.HAS_AWS == 'true'
        run: |
          docker tag cloudpulse-microservice:latest ${{ steps.login-ecr.outputs.registry }}/cloudpulse-microservice:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/cloudpulse-microservice:latest
